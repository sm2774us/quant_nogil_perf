[pytest]
# Enforce strict production testing criteria
minversion = 7.0
addopts = -ra -q --tb=short --strict-markers --import-mode=importlib
testpaths = tests

# Explicitly isolate test execution categories
markers =
    unit: Core mathematical validation tests.
    performance: Computational profiling stress tests.

# Configure output log reporting formatting layouts
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
