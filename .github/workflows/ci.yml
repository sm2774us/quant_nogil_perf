name: Institutional Multi-Toolchain & Performance Benchmarking Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 9:00 AM Eastern Time (ET) maps precisely to 13:00 UTC.
    - cron: '0 13 * * 1-5'

# 🔥 CRITICAL FIX 1: Enforce Node.js 24 execution patterns globally across all runner nodes
# This eliminates the GitHub Actions deprecation warnings completely and ensures future-proof execution.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  test-matrix:
    name: Core Test Verification Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.13t", "3.14", "3.14t"]

    steps:
    - name: Check out Repository Source
      uses: actions/checkout@v4

    - name: Install Astral uv Toolchain
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version: "latest"
        cache-dependency-glob: "**/pyproject.toml"

    - name: Provision Python Interpreter Env
      run: uv python install ${{ matrix.python-version }}

    - name: Resolve Project Dependencies and Bind Workspace
      run: uv sync --all-groups

    - name: Execute Deterministic Pytest Suite
      run: uv run pytest

  unsupervised-benchmark:
    name: Unsupervised Performance Profiling Run
    needs: test-matrix
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out Repository Source
      uses: actions/checkout@v4

    - name: Install Astral uv Toolchain
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version: "latest"
        cache-dependency-glob: "**/pyproject.toml"

    - name: Provision Absolute Reference Multi-Interpreters
      run: |
        uv python install 3.13
        uv python install 3.13t
        uv python install 3.14
        uv python install 3.14t

    # 🔥 CRITICAL FIX 2: Bypassing the virtualenv teardown loop.
    # Instead of running `uv sync` once and letting `uv run --python` delete/rebuild `.venv` 
    # repeatedly, we use explicit `uv run --isolated` or pass packages directly into specific targets.
    # To maximize speed and avoid compiling Wheels on every step, we run benchmarks directly 
    # with the target Python interpreter flag.
    
     malice-prevention-step:
    - name: Execute Default Active Context Profiling Pool (8-Threads)
      run: |
        uv run --active quant-bench execute-run \
          --threads 8 \
          --workload 5000000 \
          --output telemetry_active_raw.csv \
          --plot-dest plots/active_scaling_profile.png

    - name: Execute Comparative Legacy Run (3.13 Standard GIL Baseline)
      run: |
        uv --python 3.13 run quant-bench execute-run \
          --threads 4 \
          --workload 5000000 \
          --output results_313_gil.csv \
          --plot-dest plots/profile_313_gil.png

    - name: Execute Comparative Target Run (3.14t Highly Optimized NoGIL)
      run: |
        uv --python 3.14t run quant-bench execute-run \
          --threads 4 \
          --workload 5000000 \
          --output results_314_t.csv \
          --plot-dest plots/profile_314_t.png

    - name: Persist Benchmark Outputs and Analytical Charts as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: daily-performance-telemetry-${{ github.sha }}
        path: |
          *.csv
          plots/*.png
        retention-days: 30