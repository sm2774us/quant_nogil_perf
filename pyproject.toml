[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant_nogil_perf"
version = "1.0.0"
description = "Production-grade multi-core benchmarking engine comparing Python 3.13 and 3.14 free-threaded scaling profiles."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.7",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
]

[project.scripts]
quant-bench = "quant_nogil_perf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_nogil_perf"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
